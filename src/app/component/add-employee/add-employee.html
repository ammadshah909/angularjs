<div class="form-container">
  <div class="form-card">
    <div class="form-header">
      <h2>Add New Employee</h2>
      <p>Enter the details below to register a new team member</p>
    </div>

    <form class="employee-form">
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" placeholder="e.g. John Doe" required />
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="e.g. john.doe@company.com" required />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="role">Role / Position</label>
          <select id="role">
            <option value="developer">Developer</option>
            <option value="designer">Designer</option>
            <option value="manager">Manager</option>
            <option value="hr">HR Specialist</option>
          </select>
        </div>

        <div class="form-group">
          <label for="salary">Salary</label>
          <input type="number" id="salary" placeholder="e.g. 50000" />
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-cancel">Cancel</button>
        <button type="submit" class="btn-submit">Add Employee</button>
      </div>
    </form>
  </div>
</div>
